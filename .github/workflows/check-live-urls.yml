# Weekly check that every store-submitted URL is live over HTTPS.
# A failure emails the repo owner (GitHub's default notification for failed workflows).
name: Check live URLs

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Request each permanent URL
        run: |
          fail=0
          for url in \
            https://programielabs.com/ \
            https://tya.programielabs.com/ \
            https://tya.programielabs.com/privacy \
            https://tya.programielabs.com/terms \
            https://tya.programielabs.com/support \
            https://tya.programielabs.com/delete-account
          do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "$code  $url"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
